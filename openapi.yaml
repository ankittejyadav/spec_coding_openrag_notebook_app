openapi: 3.1.0
info:
  title: OpenRAG AI Notebook Application API
  description: OpenAPI 3.1 specification for the MVP Open-Source AI Notebook Application powered by OpenRAG and Astra DB.
  version: 1.0.0
paths:
  /api/notebooks:
    get:
      summary: List all notebooks
      description: Returns a list of all notebooks with document and note counts.
      x-requirement-id: REQ-001
      responses:
        '200':
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: object
                properties:
                  notebooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotebookSummary'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Create notebook
      description: Creates a new notebook and registers a corresponding OpenRAG knowledge filter.
      x-requirement-id: REQ-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Machine Learning Research"
                filterId:
                  type: string
                  description: "Optional existing OpenRAG filter ID to import"
      responses:
        '201':
          description: Notebook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notebooks/{id}:
    get:
      summary: Get notebook details
      description: Retrieves a single notebook by ID.
      x-requirement-id: REQ-001
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notebook found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      summary: Rename or update notebook
      description: Updates notebook attributes such as title or knowledge filter ID.
      x-requirement-id: REQ-002
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Notebook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete notebook
      description: Removes notebook and all associated sources and notes.
      x-requirement-id: REQ-002
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notebook deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notebooks/{id}/sources:
    get:
      summary: List sources in notebook
      description: Returns all uploaded source files for the given notebook.
      x-requirement-id: REQ-003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Upload source document
      description: Ingests a new document file into OpenRAG and binds it to the notebook.
      x-requirement-id: REQ-003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
      responses:
        '201':
          description: Source ingested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notebooks/{id}/sources/{sourceId}:
    get:
      summary: Get raw source content
      description: Retrieves the raw extracted document content for preview.
      x-requirement-id: REQ-005
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Source content preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    $ref: '#/components/schemas/Source'
                  content:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Remove source from notebook
      description: Deletes source record and unbinds from OpenRAG filter.
      x-requirement-id: REQ-003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Source deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notebooks/{id}/chat:
    post:
      summary: Send query to notebook AI chat
      description: Executes RAG search scoped to selected sources and streams/returns grounded answer with inline citations.
      x-requirement-id: REQ-006
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                selectedSourceIds:
                  type: array
                  items:
                    type: string
                  description: "Optional filtered source IDs for context scoping (REQ-004)"
      responses:
        '200':
          description: AI response with citations (REQ-007)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/ChatMessage'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notebooks/{id}/notes:
    get:
      summary: List notebook notes
      description: Returns all saved notes and generated artifacts for a notebook.
      x-requirement-id: REQ-011
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Save chat response or custom content as note
      description: Pin a chat response or manual text as a permanent note on the canvas.
      x-requirement-id: REQ-011
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - type
              properties:
                title:
                  type: string
                type:
                  type: string
                  enum: [manual, chat, overview, table, mindmap]
                body:
                  type: string
                tableData:
                  type: string
                mindMapData:
                  type: string
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notebooks/{id}/notes/{noteId}:
    delete:
      summary: Delete note
      description: Removes a saved note from the notebook canvas.
      x-requirement-id: REQ-011
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Note deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notebooks/{id}/artifacts:
    post:
      summary: Generate notebook artifact
      description: Generates an overview summary (REQ-008), structured table (REQ-009), or mind map (REQ-010) from selected sources (REQ-004).
      x-requirement-id: REQ-008
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - artifactType
              properties:
                artifactType:
                  type: string
                  enum: [overview, table, mindmap]
                  description: "Type of artifact to generate (REQ-008: overview, REQ-009: table, REQ-010: mindmap)"
                selectedSourceIds:
                  type: array
                  items:
                    type: string
                  description: "Filter sources for generation (REQ-004)"
      responses:
        '200':
          description: Generated artifact note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    NotebookSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        openragFilterId:
          type: string
        sourceCount:
          type: integer
        noteCount:
          type: integer
        createdAt:
          type: string

    Notebook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        openragFilterId:
          type: string
        createdAt:
          type: string

    Source:
      type: object
      properties:
        id:
          type: string
        notebookId:
          type: string
        title:
          type: string
        type:
          type: string
        url:
          type: string
        openragFilename:
          type: string
        createdAt:
          type: string

    Note:
      type: object
      properties:
        id:
          type: string
        notebookId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [manual, chat, overview, table, mindmap]
        body:
          type: string
        tableData:
          type: string
        mindMapData:
          type: string
        createdAt:
          type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        notebookId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              score:
                type: number
        createdAt:
          type: string

  responses:
    BadRequest:
      description: Invalid request parameter or body.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
